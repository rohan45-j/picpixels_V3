{% load unfold %}

<div class="bg-white border-b border-base-200 mb-6 px-4 z-40 dark:bg-base-900 dark:border-base-800 dark:text-font-default-dark {% element_classes 'header' %}">
    <div class="{% if not cl.model_admin.list_fullwidth and is_fullwidth != "1" %}container{% endif %} flex items-center h-16 mx-auto py-4 {% element_classes 'header_inner' %}">
        <div id="header-inner" class="flex items-center relative w-full">
            <div class="flex items-center w-full">
                {% block usertools %}
                    {% if has_permission %}
                        {% block welcome-msg %}
                            {% include 'unfold/helpers/welcomemsg.html' %}
                        {% endblock %}

                        <button class="xl:hidden mr-3 p-2 rounded-md hover:bg-base-100 dark:hover:bg-base-800" aria-label="Toggle sidebar" x-on:click="sidebarMobileOpen = !sidebarMobileOpen">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="12" x2="21" y2="12"></line>
                                <line x1="3" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>

                        {% block userlinks %}
                            {% include 'unfold/helpers/userlinks.html' %}
                        {% endblock %}
                    {% endif %}
                {% endblock %}
            </div>
        </div>
    </div>
</div>
