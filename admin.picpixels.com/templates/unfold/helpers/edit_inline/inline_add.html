{% load unfold %}

{% for inline_admin_form in inline_admin_formset %}
    {% if forloop.last and inline_admin_formset.has_add_permission %}
        <a href="#" class="add-row flex items-center font-medium -ml-1.5 -my-1.5 select-none text-primary-600 dark:text-primary-500 {% if inline_admin_formset.formset.total_form_count >= inline_admin_formset.formset.max_num %}hidden{% endif %}">
            <span class="flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg border border-primary-200 dark:border-primary-800 hover:bg-primary-50 dark:hover:bg-primary-900/20 hover:shadow-sm transition-all duration-150">
                <span class="material-symbols-outlined text-base leading-none">add</span>
                <span>{{ inline_admin_formset.inline_formset_data|inline_add_button_text }}</span>
            </span>
        </a>
    {% endif %}
{% endfor %}
